name: CI Build & Auto Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-verify:
    name: Build & Validate ATHAR Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets & PWA
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || exit 1
          test -f dist/sw.js || exit 1
          test -f dist/manifest.webmanifest || exit 1
          test -f dist/favicon.svg || exit 1
          echo "All production artifacts and PWA files verified successfully!"
