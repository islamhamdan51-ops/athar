<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="atharGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#82b939"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06110c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#06110c"/>
  <circle cx="256" cy="256" r="220" fill="url(#glowGrad)"/>
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#0c1e15" stroke="#10b981" stroke-width="6" stroke-opacity="0.3"/>
  
  <!-- Droplet & Seedling Mark -->
  <g transform="translate(256, 240)">
    <path d="M0 -150 C80 -60 120 10 120 70 C120 136 66 190 0 190 C-66 190 -120 136 -120 70 C-120 10 -80 -60 0 -150 Z" 
          fill="url(#atharGrad)"/>
    
    <!-- Sprout Cutout / Sound Wave Motif -->
    <path d="M0 -90 L0 120 M-45 35 Q0 80 45 35" 
          fill="none" 
          stroke="#06110c" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Golden Sand Root Dot -->
    <circle cx="0" cy="140" r="14" fill="#d4a373"/>
  </g>
</svg>
