<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="atharGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="85%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#05140d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Container Background -->
  <rect width="512" height="512" rx="120" fill="#071710"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#atharGrad)" stroke-width="4" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="230" fill="url(#glowGrad)"/>
  
  <!-- ATHAR Emblem: Soundwave Acoustic Rings & Rising Growth Sprout -->
  <path d="M120 256 A136 136 0 0 1 392 256" fill="none" stroke="url(#atharGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="8 20" opacity="0.45"/>
  <path d="M155 256 A101 101 0 0 1 357 256" fill="none" stroke="url(#atharGrad)" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
  <path d="M190 256 A66 66 0 0 1 322 256" fill="none" stroke="url(#atharGrad)" stroke-width="16" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Central Rising Tree Stem & Alif of Athar -->
  <path d="M256 390 L256 160" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Dynamic Leaf Wings / Acoustic Petals -->
  <path d="M256 280 C290 240 330 230 335 180 C295 185 270 215 256 250 Z" fill="url(#atharGrad)"/>
  <path d="M256 320 C220 280 180 270 175 220 C215 225 240 255 256 290 Z" fill="url(#atharGrad)"/>
  
  <!-- Upper Madda / Acoustic Crest Wave (المد الصوتي والأثر الممتد) -->
  <path d="M195 130 C225 100 245 140 275 110 C295 90 315 105 325 115" fill="none" stroke="url(#atharGrad)" stroke-width="22" stroke-linecap="round"/>
  
  <!-- Spark of Impact Crown Dot -->
  <circle cx="256" cy="115" r="14" fill="url(#goldGrad)"/>
</svg>
